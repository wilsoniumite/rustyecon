# The rustyecon workspace. The plan it follows is docs/PLAN.md, and the engine contract
# is docs/ENGINE.md.
# Every crate lives in crates/<short name> and is named rustyecon-<short name>, so that no
# package shadows a standard crate (a package called `core` would).

[workspace]
members = ["crates/*"]
# D1 (docs/GUI.md §8.2): the GUI never gates engine work. A bare `cargo build`, `test` or
# `clippy` covers every crate but crates/gui; scripts/gate.sh says `--workspace --exclude
# rustyecon-gui`, and scripts/gui.sh gates the GUI. A new crate joins this list by hand.
default-members = [
    "crates/agents",
    "crates/certify",
    "crates/cli",
    "crates/core",
    "crates/engine",
    "crates/markets",
    "crates/oracle",
    "crates/probe",
    "crates/worldgen",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Third-party: what Phase 0 needs, nothing more.
serde = { version = "1", features = ["derive"] }
ron = "0.8"
bincode = "1"
libm = "0.2"
# The cli's argument parser, and temporary directories for the cli's and certify's tests only.
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"
# Certify's telemetry, behind its `parquet` feature (docs/CERTIFY.md §12, C7): pure Rust, no C
# build. LZ4_RAW through lz4_flex; no zstd, snappy, brotli or flate2, and no arrow.
parquet = { version = "=60.0.0", default-features = false, features = ["lz4"] }
# The GUI's stack (docs/GUI.md §3.1, D6), for crates/gui alone: pinned with `=` and upgraded
# together, only at a G-stage boundary. eframe keeps its default features (wgpu, winit,
# accesskit) and leaves out `persistence`, which would bring a second ron. mimalloc is native
# only, and egui_kittest is a dev-dependency.
eframe = "=0.36.2"
egui = "=0.36.2"
egui_plot = "=0.37.0"
egui_extras = { version = "=0.36.2", default-features = false }
egui_tiles = "=0.17.1"
rfd = "=0.17.2"
mimalloc = "=0.1.52"
egui_kittest = { version = "=0.36.2", features = ["eframe"] }
# The map (docs/GUI.md §3.1, §6; D.3): earcut triangulates each region once, holes included,
# and colorous gives the neutral sequential and diverging scales. G4's and G2's pins, brought
# forward with the map.
earcut = "=0.4.11"
colorous = "=1.0.16"

# The workspace's own crates.
rustyecon-core = { path = "crates/core" }
rustyecon-markets = { path = "crates/markets" }
rustyecon-agents = { path = "crates/agents" }
rustyecon-engine = { path = "crates/engine" }
rustyecon-worldgen = { path = "crates/worldgen" }
rustyecon-certify = { path = "crates/certify" }
rustyecon-oracle = { path = "crates/oracle" }
rustyecon-probe = { path = "crates/probe" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The lists these two lints enforce are in clippy.toml: the std hash containers (R8) and
# the platform maths library's transcendentals (ADDENDUM A5).
disallowed_types = "deny"
disallowed_methods = "deny"

# The rustyecon workspace. The plan it follows is docs/PLAN.md, and the engine contract
# is docs/ENGINE.md.
# Every crate lives in crates/<short name> and is named rustyecon-<short name>, so that no
# package shadows a standard crate (a package called `core` would).

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Third-party: what Phase 0 needs, nothing more.
serde = { version = "1", features = ["derive"] }
ron = "0.8"
bincode = "1"
libm = "0.2"
# The cli's argument parser, and temporary directories for the cli's tests only.
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"

# The workspace's own crates.
rustyecon-core = { path = "crates/core" }
rustyecon-markets = { path = "crates/markets" }
rustyecon-agents = { path = "crates/agents" }
rustyecon-engine = { path = "crates/engine" }
rustyecon-worldgen = { path = "crates/worldgen" }
rustyecon-certify = { path = "crates/certify" }
rustyecon-oracle = { path = "crates/oracle" }
rustyecon-probe = { path = "crates/probe" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The lists these two lints enforce are in clippy.toml: the std hash containers (R8) and
# the platform maths library's transcendentals (ADDENDUM A5).
disallowed_types = "deny"
disallowed_methods = "deny"

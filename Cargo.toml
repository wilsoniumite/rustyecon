[package]
name = "rustyecon"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
bincode = "1"
clap = { version = "4", features = ["derive"] }
parquet = { version = "59.1.0", default-features = false, features = ["snap", "zstd"] }

[features]
test-utils = []

[dev-dependencies]
approx = "0.5"
parquet = { version = "59.1.0", default-features = false, features = ["snap", "zstd"] }
tempfile = "3"

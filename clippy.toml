# Two standing rules, checked by `cargo clippy` (the lints are denied in Cargo.toml).
# An exception is an #[expect(clippy::disallowed_types, reason = "...")] or
# #[expect(clippy::disallowed_methods, reason = "...")] at the use site, so it carries
# its own receipt.

# R8: no unordered iteration on the delta path. The std hash containers iterate in an
# order that changes from process to process.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "R8: iteration order is random per process; use BTreeMap or a sorted Vec" },
    { path = "std::collections::HashSet", reason = "R8: iteration order is random per process; use BTreeSet or a sorted Vec" },
]

# ADDENDUM A5: transcendentals on the state or verdict path go through the one module backed
# by the libm crate. The platform maths libraries disagree: glibc 2.35 and the MSVC runtime
# differ by 1 ulp on about 0.5% of exp inputs, 0.09% of powf and 3.2% of sin, and powi's
# precision is unspecified. sqrt is correctly rounded everywhere and stays allowed.
disallowed-methods = [
    { path = "f64::exp", reason = "A5: use the libm-backed module" },
    { path = "f64::exp2", reason = "A5: use the libm-backed module" },
    { path = "f64::exp_m1", reason = "A5: use the libm-backed module" },
    { path = "f64::ln", reason = "A5: use the libm-backed module" },
    { path = "f64::ln_1p", reason = "A5: use the libm-backed module" },
    { path = "f64::log", reason = "A5: use the libm-backed module" },
    { path = "f64::log2", reason = "A5: use the libm-backed module" },
    { path = "f64::log10", reason = "A5: use the libm-backed module" },
    { path = "f64::powf", reason = "A5: use the libm-backed module" },
    { path = "f64::powi", reason = "A5: precision is unspecified; use the libm-backed module" },
    { path = "f64::cbrt", reason = "A5: use the libm-backed module" },
    { path = "f64::hypot", reason = "A5: use the libm-backed module" },
    { path = "f64::sin", reason = "A5: use the libm-backed module" },
    { path = "f64::cos", reason = "A5: use the libm-backed module" },
    { path = "f64::tan", reason = "A5: use the libm-backed module" },
    { path = "f64::sin_cos", reason = "A5: use the libm-backed module" },
    { path = "f64::asin", reason = "A5: use the libm-backed module" },

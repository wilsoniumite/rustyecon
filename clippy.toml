    { path = "f64::asinh", reason = "A5: use the libm-backed module" },
    { path = "f64::acosh", reason = "A5: use the libm-backed module" },
    { path = "f64::atanh", reason = "A5: use the libm-backed module" },
    { path = "f32::exp", reason = "A5: use the libm-backed module" },

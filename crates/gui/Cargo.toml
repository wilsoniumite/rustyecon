[package]
name = "rustyecon-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The interactive frontend (docs/GUI.md): live runs, plots and the tape editor, in egui."
# The cli's build script stamps this binary too: the commit, the dirty flag, the target and the
# compiler (docs/CERTIFY.md §3), so a GUI run names its build as a cli run does (U3, U4).
build = "../cli/build.rs"

[lib]
name = "rustyecon_gui"
path = "src/lib.rs"

[[bin]]
name = "rustyecon-gui"
path = "src/main.rs"

# D1 (docs/GUI.md §8.2): nothing depends on this crate, and the workspace's default members
# leave it out, so the GUI never gates engine work. It depends on the engine alone for the run
# and on certify, without its `parquet` feature, for the run key and the manifest (§3.2).
# model/, run/, vm/ and edit/ use no egui (tests/scans.rs); only ui/ and app.rs draw.
# There is no edge to core (G1.1): the engine re-exports `num`, the libm-backed maths the
# display takes (U6, U9), and the tape's raw schema with `Basis` and `Unit`, which edit/ writes
# entries in, so core's writer is out of the GUI's reach by type again (E1, U1), and a scan
# holds that no source names core (tests/scans.rs,
# the_gui_reaches_core_through_the_engine_alone).
# The map (D.3) reads the county atlas and the demo world's lenses from rustyecon-worldgen,
# which has no egui, file, thread or clock, triangulates with earcut and colours with colorous
# (docs/GUI.md §3.1, §6).
[dependencies]
rustyecon-engine.workspace = true
rustyecon-certify.workspace = true
rustyecon-worldgen.workspace = true
serde.workspace = true
ron.workspace = true
eframe.workspace = true
egui.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true
egui_tiles.workspace = true
earcut.workspace = true
colorous.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
mimalloc.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
